version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: prodseller_bot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: reseller_bot
      POSTGRES_USER: bot_user
      POSTGRES_PASSWORD: secure_db_password_change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot_user -d reseller_bot"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prodseller_telegram_bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://bot_user:secure_db_password_change_me@postgres:5432/reseller_bot
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data:
